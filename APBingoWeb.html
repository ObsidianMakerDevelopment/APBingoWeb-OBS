<html>

<head>
    <meta charset="utf-8">

</head>

<body>

    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        table {
            width: 100vw;
            height: 100vh;
        }

        .cell {
            background-color: #0072ff;

        }

        td {
            min-width: 48px;
            min-height: 48px;
            text-align: center;
        }

        .cell.completed {
            background-color: blueviolet;
        }
    </style>
    <style id="computed"> </style>
    <div id="grid"></div>
    <script type="module">
        // Default config
        let server = undefined;
        let password = undefined;
        let username = undefined;

        async function loadConfig() {
            // Parse query parameters
            const params = new URLSearchParams(window.location.search);

            // Fallback to query parameters if present
            if (params.has("server")) server = params.get("server");
            if (params.has("username")) username = params.get("username");
            if (params.has("password")) password = params.get("password");

            // If still missing, prompt interactively
            if (!server) {
                alert("Your browser blocked local file access. For automatic loading, use Firefox. Otherwise, please enter the server address manually.");
                const inputServer = prompt("Enter the Archipelago server address:", "archipelago.gg:38281");
                if (inputServer) server = inputServer;
            }

            if (!username) {
                const inputUser = prompt("Enter your username:", "Player1");
                if (inputUser) username = inputUser;
            }

            if (!params.has("password") && !password){
                const inputPass = prompt("Enter your password (leave blank if none):", "");
                if (inputPass) password = inputPass;
            }
        }
        await loadConfig();

        import * as AP from 'https://cdn.jsdelivr.net/npm/archipelago.js@2.0.4/+esm'
        const ap_client = new AP.Client();
        window.ap_client = ap_client;
        let logData = await ap_client.login(server, username, "APBingo", { password, tags: ["AP"], version: { major: 0, minor: 6, build: 3 }, items: AP.itemsHandlingFlags.all })
        ap_client.logData = logData

        ap_client.items.on("itemsReceived", (items) => {
            setTimeout(() => {
                refreshGrid();
            }, 1);
        })
        setTimeout(() => {
            refreshGrid();
        }, 1);

        let connect_packet = { slot_data: ap_client.logData };
        console.log(connect_packet);
        //Build
        let tab = window.tab = {}

        let table = document.createElement("table");
        document.getElementById("grid").appendChild(table);

        let tr = document.createElement("tr");
        table.appendChild(tr);

        for (let i = 0; i <= connect_packet.slot_data.boardSize; i++) {
            let td = document.createElement("td");
            if (i > 0) {
                td.innerText = "" + i;
            }
            tr.appendChild(td);
        }
        let pos = 0;
        for (let j = 1; j <= connect_packet.slot_data.boardSize; j++) {
            tr = document.createElement("tr");
            table.appendChild(tr);
            let letter = String.fromCharCode(0x40 + j);
            for (let i = 0; i <= connect_packet.slot_data.boardSize; i++) {
                let td = document.createElement("td");
                if (i > 0) {
                    td.innerText = letter + i + ": " + connect_packet.slot_data.boardLocations[pos++];
                    td.classList.add("cell");

                }
                else {
                    td.innerText = letter;
                }
                tab[letter + i] = td;
                tr.appendChild(td);
            }
        }

        function refreshGrid() {

            document.querySelectorAll("td.cell").forEach(el => {
                el.classList.remove("completed");
            })

            for (let it of ap_client.items.received) {
                tab[it.name].classList.add("completed");
            }

            //Validate bingo and send checks

            let bingos = {

            };

            function readBingo(id, name) {
                let descriptor = (name.match(/\(([^\)]+)\)/)[1]);
                if (!bingos[descriptor]) {
                    bingos[descriptor] = {
                        descriptor,
                        completed: false,
                        checks: []
                    }
                }
                bingos[descriptor].checks.push(id);
                return name;
            }

            (ap_client.room.checkedLocations.map(id => readBingo(id, ap_client.package.lookupLocationName("APBingo", id))));
            (ap_client.room.missingLocations.map(id => readBingo(id, ap_client.package.lookupLocationName("APBingo", id))));

            Object.values(bingos).forEach(bingo => {
                //Check this bingo
                if (bingo.descriptor == "ALL") {
                    bingo.completed = document.querySelectorAll(".cell").length == document.querySelectorAll(".completed");
                }
                else {
                    /**
                     * @type {string[]}
                     */
                    let parts = bingo.descriptor.split("-");
                    let letterBegin = parts[0][0];
                    let letterEnd = parts[1][0];
                    parts = parts.map(x => parseInt(x.substring(1)));
                    let letterVariation = Math.sign(letterEnd.charCodeAt(0) - letterBegin.charCodeAt(0))
                    let numVariation = (parts[1] != parts[0]) ? 1 : 0;
                    let is_completed = true;
                    for (let i = 0; i < connect_packet.slot_data.boardSize; i++) {
                        let letter = String.fromCharCode(letterBegin.charCodeAt(0) + i * letterVariation);
                        let num = parts[0] + i * numVariation;
                        let cell = letter + num;
                        is_completed &= !!tab[cell].classList.contains("completed");
                    }
                    bingo.completed = !!is_completed;

                    //Send checks for that row
                    if (bingo.completed)
                        ap_client.check(...bingo.checks);
                }
            })

            if (Object.values(bingos).filter(x => x.completed).length >= connect_packet.slot_data.requiredBingoCount) {
                //Trigger goal
                console.log("Triggering goal");
                ap_client.check(...ap_client.room.missingLocations) //Bingo(ALL)
                ap_client.goal();
            }
        }

        document.getElementById("computed").innerHTML = ".cell{ color: " + connect_packet.slot_data.customText + "}" +
            "body{ background-color: " + connect_packet.slot_data.customBoard + "}" +
            ".cell{ background-color: " + connect_packet.slot_data.customSquare + "}" +
            ".cell.completed{ background-color: " + connect_packet.slot_data.customHLSquare + "}";


    </script>
</body>

</html>
